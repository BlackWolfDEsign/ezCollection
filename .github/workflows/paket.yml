# Paket bauen und als GitHub-Release ablegen (BigWigs Packager) – nur bei einem Git-Tag „v…“ (z. B. v1.0.0-beta1).
# Auf CurseForge und Wago Addons geht es nur, wenn die Repo-Variable PORTALE den Wert „an“ hat (GitHub » Settings »
# Secrets and variables » Actions » Variables); sonst bekommt der Packager ihre Schlüssel nicht und überspringt beide.
# Nachholen: PORTALE auf „an“ stellen, den Lauf des Tags noch einmal ausführen („Re-run all jobs“, bei GitHub nur
# begrenzte Zeit möglich) und PORTALE danach wieder löschen – sonst lädt der nächste Tag auch dort hoch.
# Ein Tag mit „beta“ bzw. „alpha“ landet im Kanal Beta bzw. Alpha, sonst im Kanal Release.
# Die Schlüssel liegen als Secrets im Repo (GitHub » Settings » Secrets and variables » Actions): CF_API_KEY für
# CurseForge, WAGO_API_TOKEN für Wago – nie in einer Datei.
name: Paket

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, feste Fassung (der Packager bekommt Secrets)
        with:
          fetch-depth: 0

      # Wache für Tag und Protokoll (dieselben Regeln wie „luajit tools/versions.lua . --tag“, das es im öffentlichen
      # Repo nicht gibt): Die erste Überschrift „## …“ von CHANGELOG.md beginnt mit genau diesem Tag und sagt nicht mehr
      # „not released“ / „noch nicht erschienen“, ihr Abschnitt hat keine Platzhalter „(follows / folgt)“ oder
      # „NACH-27“. Sonst bricht der Lauf vor dem Hochladen ab.
      - name: Protokoll passt zum Tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # tr -d '\r': robust gegen CRLF (am 20.11.2026 las die Prüfung sonst „v1.0.0-beta1\r“ statt des Tags)
          kopf=$(tr -d '\r' < CHANGELOG.md | grep -m1 '^## ' || true)
          wort=$(printf '%s\n' "$kopf" | awk '{print $2}')
          abschnitt=$(tr -d '\r' < CHANGELOG.md | awk '/^## /{n++} n==1')
          fehler=0
          if [ "$wort" != "$tag" ]; then
            echo "::error::CHANGELOG.md: die erste Überschrift nennt nicht den Tag $tag: $kopf"; fehler=1
          fi
          if printf '%s\n' "$kopf" | grep -qiE 'not released|noch nicht erschienen'; then
            echo "::error::CHANGELOG.md: $kopf sagt noch „nicht erschienen“"; fehler=1
          fi
          if printf '%s\n' "$abschnitt" | grep -qE '\(follows / folgt\)|NACH-27'; then
            echo "::error::CHANGELOG.md: Platzhalter im Abschnitt von $tag"; fehler=1
          fi
          exit "$fehler"

      - name: Bauen und hochladen
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812   # v2, feste Fassung
        with:
          # -n: Datei- und Anzeigename; der Paketordner heißt ezCore (.pkgmeta), das ZIP ezCollection-<Tag>-forever.zip.
          args: -g forever -n "ezCollection-{project-version}{classic}:{project-version}{classic}"
        env:
          CF_API_KEY: ${{ vars.PORTALE == 'an' && secrets.CF_API_KEY || '' }}
          WAGO_API_TOKEN: ${{ vars.PORTALE == 'an' && secrets.WAGO_API_TOKEN || '' }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
